# Streamlit config for Kisan Sahayak.
#
# Streamlit's dev file-watcher walks the import graph of every loaded module.
# transformers (pulled in by sentence-transformers for the re-ranker) exposes
# lazy submodules that raise ModuleNotFoundError: torchvision when touched, so
# the watcher spends ~20s crawling and then floods the log with a traceback that
# has nothing to do with this app. Turning the watcher off makes startup fast
# and the log readable; restart the server to pick up code changes.
[server]
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#4e8b2a"
backgroundColor = "#f7faf0"
secondaryBackgroundColor = "#eaf3dd"
textColor = "#22331a"
